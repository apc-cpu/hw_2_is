<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application.</p>
    <hr>
    {% if user.is_authenticated %}
    <p>Logged in as <strong>{{ user.username }}</strong></p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="/app/">
        <button type="submit">Log Out</button>
    </form>
    {% else %}
    <p>Not logged in.</p>
    <p><a href="/accounts/login/">Log In</a> | <a href="/app/new">Sign Up</a></p>
    {% endif %}
    <p>Current time (Central): {{ current_time }}</p>

</div>
</body>
</html>
